# AIDE Layout Configuration
# =============================================================================
#
# To customise, copy this file to your user config directory and edit it.
# The app checks that location first, then falls back to this bundled file.
# Click  View > Open config folder  to open the right directory.
#
# Config directory:
#   Windows : %APPDATA%\AIDE\layouts.conf
#   macOS   : ~/Library/Application Support/AIDE/layouts.conf
#   Linux   : ~/.config/AIDE/layouts.conf
#
# =============================================================================
# FORMAT
# =============================================================================
#
# Layouts are defined as named sections followed by ASCII art:
#
#   [My Layout Name]
#   <ascii art>
#
# CHARACTER MEANING:
#
#   1           →  new Terminal     pane
#   2           →  new Browser      pane
#   3           →  new Explorer     pane
#   4           →  new Text Editor  pane
#   (space)     →  extend the pane to the LEFT (horizontal span),
#                  or extend the pane ABOVE (vertical span) if nothing is to the left
#   shorter row →  the entire row spans from above (all panes extend downward)
#
# Every occurrence of 1, 2, 3, or 4 in a full-length row creates a NEW pane.
# A row shorter than the maximum width means ALL its columns extend the pane above.
# Maximum 12 panes per layout.
# Blank lines and lines starting with # are ignored.
#
# =============================================================================
# EXAMPLES
# =============================================================================
#
# 2×2 grid (4 panes):          1 pane spanning left × 2 rows (3 panes):
#   11                           12
#   11                            2
#
# Two terminals side by side:  Two terminals stacked:
#   11                           1
#                                1
#
# One browser spanning 2 rows, two terminals stacked on the right:
#   21
#    1
#
# Two browsers each spanning 3 rows, three terminals stacked on the right:
#   221
#     1
#     1
#
# Terminal spanning 2 columns (space extends it to the right), then a browser:
#   1 2
#
# Two terminals + one browser, each pair spanning 2 rows (6 panes):
#   112
#   11
#   112
#   11
#   (rows "11" are shorter → they extend the row above them; browsers span 2 rows)
#
# =============================================================================


